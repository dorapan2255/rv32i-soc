<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <style>
    .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:10; }
    .core { fill:#dbeafe; stroke:#2563eb; stroke-width:3; rx:12; }
    .bus { stroke:#475569; stroke-width:3; fill:none; marker-end:url(#arrow); }
    .title { font:700 24px sans-serif; fill:#0f172a; }
    .label { font:600 18px sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
    .small { font:14px sans-serif; fill:#475569; text-anchor:middle; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="480" y="38" class="title" text-anchor="middle">Lightweight RV32I SoC Architecture</text>
  <rect x="60" y="160" width="250" height="150" class="core"/>
  <text x="185" y="205" class="label">RV32I CPU Core</text>
  <text x="185" y="240" class="small">Single-cycle datapath</text>
  <text x="185" y="265" class="small">21 implemented instructions</text>
  <rect x="390" y="75" width="210" height="80" class="box"/>
  <text x="495" y="110" class="label">Instruction Memory</text>
  <text x="495" y="138" class="small">1 KiB</text>
  <rect x="390" y="220" width="210" height="80" class="box"/>
  <text x="495" y="260" class="label">MMIO Interconnect</text>
  <rect x="700" y="75" width="190" height="80" class="box"/>
  <text x="795" y="110" class="label">Data Memory</text>
  <text x="795" y="138" class="small">1 KiB</text>
  <rect x="700" y="210" width="190" height="80" class="box"/>
  <text x="795" y="245" class="label">UART TX</text>
  <text x="795" y="273" class="small">8N1 serial output</text>
  <rect x="700" y="345" width="190" height="80" class="box"/>
  <text x="795" y="380" class="label">Timer</text>
  <text x="795" y="408" class="small">32-bit counter</text>
  <path d="M310 190 L350 190 L350 115 L390 115" class="bus"/>
  <text x="350" y="95" class="small">instruction</text>
  <path d="M310 260 L390 260" class="bus"/>
  <path d="M600 260 L650 260 L650 115 L700 115" class="bus"/>
  <path d="M600 260 L700 250" class="bus"/>
  <path d="M600 260 L650 260 L650 385 L700 385" class="bus"/>
  <text x="650" y="455" class="small">Memory-mapped I/O</text>
</svg>
